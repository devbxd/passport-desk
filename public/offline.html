<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Passport Desk</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #fbfaf6;
        color: #1d2a53;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #5a6480;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        padding: 0.65rem 1.35rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fbfaf6;
        background: #1d2a53;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #13182b;
          color: #f2f1ec;
        }
        p {
          color: #a8b0c4;
        }
        button {
          background: #e2b542;
          color: #13182b;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>
        Passport Desk needs a connection to scan and save passports. Check your
        internet connection and try again.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
